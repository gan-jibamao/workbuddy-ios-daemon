name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: misakano7545/workbuddy2api-panel
  UPSTREAM_REF: cffb0389608947cbc196ec79ca73f8b4465b3040   # 含 PR #196 的合并提交

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.UPSTREAM_REF }}
          path: src

      # 本仓库的两个行为补丁（上游不动，只在这里落）：
      #   0001 监听失败不再 log.Fatal —— 端口被占时退避重试，进程常驻。
      #        iOS 上 App 内嵌服务与 daemon 抢 7863，旧行为是两边互相 os.Exit。
      #   0002 根路径 302 到 /panel/ —— 面板 HTML 用同目录相对路径，
      #        直接挂在 "/" 会让 theme.js/app.js 解析成 /theme.js 而 404。
      - name: apply patches
        run: |
          set -e
          for p in patches/*.patch; do
            echo "== apply $p"
            patch -p1 -d src --batch --forward < "$p"
          done

      - name: install local tests
        run: |
          set -e
          cp patches/tests/main_listen_retry_test.go src/cmd/server/
          cp patches/tests/handler_root_redirect_test.go src/internal/server/

      # 补丁打上 ≠ 真的接上了。0009 第一版就漏了 main.go 里那行调用：
      # 文件进了包、函数成了死代码，抬手 jetsam 等于没做。这里直接验接线。
      - name: verify patch wiring
        run: |
          set -e
          grep -q 'applyProcessLimits()' src/cmd/server/main.go
          grep -q 'rss=%dMB' src/cmd/server/main.go
          test -f src/cmd/server/iosmem_darwin.go
          test -f src/cmd/server/iosmem_other.go
          echo "wiring ok"

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      # 面板资源换成打过补丁的那三份：这个 App 的 WKWebView 里 confirm / 下载 / 文件选择
      # 都不可用，不换的话 daemon 面板同样是坏的。
      - name: swap panel assets
        run: |
          set -e
          cp assets/index.html assets/app.js assets/theme.js src/internal/panel/
          ls -l src/internal/panel/index.html src/internal/panel/app.js

      - name: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(TZ=Asia/Shanghai date +%Y.%-m.%-d.%-H%M)" >> "$GITHUB_ENV"
          fi

      - name: build darwin/arm64
        run: |
          set -e
          cd src
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w -X main.appVersion=${VERSION}" -o ../wb2api ./cmd/server

      - name: patch platform (macos -> ios)
        run: python3 scripts/patch_platform.py wb2api

      - name: sign (ldid ad-hoc + entitlements)
        run: |
          set -e
          # ldid 已内置在 tools/ 里：GitHub Release CDN 对 runner 偶发 504，
          # 每次构建现下载会随机把流水线打挂。
          # -S<file> = 带 entitlements 签名。iOS 上 platform-application 决定
          # 该进程是「平台守护进程」还是「mobile 用户沙盒进程」，直接影响 jetsam band。
          chmod +x tools/ldid
          tools/ldid -Spackaging/wb2api.entitlements wb2api
          if ! grep -qa 'platform-application' wb2api; then
            echo "签名里没有 platform-application —— entitlements 没进包" >&2
            exit 1
          fi
          if ! grep -qa 'com.apple.private.memorystatus' wb2api; then
            echo "签名里没有 memorystatus —— 抬 jetsam 上限会 EPERM" >&2
            exit 1
          fi

      # 平台对 != 能加载。这一关检查 iOS 真实路径白名单 + 签名页哈希：
      # v2026.11.9-daemon 就是「平台改对了、路径还是 macOS」死在真机 dyld 上。
      - name: verify macho (iOS-loadable + 签名有效)
        run: |
          set -e
          python3 scripts/verify_macho.py wb2api
          dash -n packaging/postinst
          dash -n packaging/wb2api-doctor

      # 这一版真机死因是内核 per-process-limit（18MB）。少了这两个键就是复发。
      - name: verify plist (jetsam 限额)
        run: |
          set -e
          python3 - <<'PY'
          import plistlib
          d = plistlib.load(open('packaging/com.gan.wb2api.plist', 'rb'))
          j = d.get('JetsamProperties') or {}
          assert j.get('JetsamMemoryLimit', 0) >= 128, j
          assert j.get('JetsamPriority', 0) <= -10, j
          assert d.get('EnablePressuredExit') is False, 'EnablePressuredExit 必须是 false'
          assert d.get('KeepAlive') is True, d.get('KeepAlive')
          assert '@BIN@' in d['ProgramArguments'][0] or d['ProgramArguments'][0].startswith('/')
          print('plist ok:', j)
          PY

      - name: package deb
        run: |
          set -e
          ROOT=out
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/var/jb/usr/local/bin" "$ROOT/var/jb/Library/LaunchDaemons"
          cp wb2api "$ROOT/var/jb/usr/local/bin/wb2api"
          cp packaging/wb2api-doctor "$ROOT/var/jb/usr/local/bin/wb2api-doctor"
          cp packaging/com.gan.wb2api.plist "$ROOT/var/jb/Library/LaunchDaemons/"
          cp packaging/postinst "$ROOT/DEBIAN/postinst"
          sed "s/@VERSION@/${VERSION}/" packaging/control > "$ROOT/DEBIAN/control"
          chmod 755 "$ROOT/DEBIAN/postinst" "$ROOT/var/jb/usr/local/bin/wb2api" \
                    "$ROOT/var/jb/usr/local/bin/wb2api-doctor"
          chmod 644 "$ROOT/DEBIAN/control" "$ROOT/var/jb/Library/LaunchDaemons/com.gan.wb2api.plist"
          DEB="com.gan.wb2api_${VERSION}_iphoneos-arm64e.deb"
          # -Zgzip：越狱设备上的 dpkg 版本参差，zstd 不一定认，gzip 最稳
          dpkg-deb -Zgzip --build --root-owner-group "$ROOT" "$DEB"
          sha256sum "$DEB" | tee "$DEB.sha256"
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          ls -l "$DEB"

      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-deb
          path: |
            ${{ env.DEB }}
            ${{ env.DEB }}.sha256

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DEB }}
            ${{ env.DEB }}.sha256
          generate_release_notes: true
