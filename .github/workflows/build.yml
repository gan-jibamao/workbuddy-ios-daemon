name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      panel:
        description: '面板资源：upstream=跟随上游（默认）/ legacy=仓库内 WKWebView 补丁版'
        type: choice
        options: [upstream, legacy]
        default: upstream

permissions:
  contents: write

env:
  UPSTREAM: misakano7545/workbuddy2api-panel
  # 历史：11-12 1c007bb → 11-15 89cdfe7（69 提交）→ 11-16 06a401e（19 提交）。
  # 11-15 那批的要点：连坐暂停阈值随池子缩放 + 指数退避（修 11-13 两段全站 503）、
  # 领奖后回读 claimed_at 才算入账、toolOnly 续写判定修「我继续」收尾。
  # 本地长期补丁：0013 = 面板自动刷新间隔热生效（该字段原本只在 panel.New 拷一次，
  # 保存成功但 overview 永远回旧值，前端永远 5 秒——面板表现为「保存不了」）。
  # 历史：11-12 1c007bb → 11-15 89cdfe7（69）→ 11-16 06a401e（19）→ 11-18 733942a（64）。
  # 本地长期补丁：0013 = 面板自动刷新间隔热生效（上游至今没修：该字段只在
  # panel.New 拷一次，保存成功但 overview 永远回旧值，前端永远 5 秒）。
  # 2026-11-22：be99749 → e2d0eb6。10 提交 / 16 文件。要点：
  #   · ASR 请求体落盘前钳到 3MB+64KiB，并清 multipart 临时文件（#277 收尾）
  #   · TTS 缺 done 帧判截断并换号重试；ASR 认 response_format；音频台账带账号
  #   · 11102「模型 id 不存在」归请求级，不再换号白打全池（#280）
  #   · 视频参考素材补成上游要的对象数组（e2d0eb6 附真号实测结论）
  #   · auth 过期时间夹具改相对当前时间（又一处写死毫秒串的 time bomb）
  # 12 个补丁在 e2d0eb6 上实测 12/12 干净落地（无 .rej）。
  UPSTREAM_REF: e2d0eb6a4039438f7ef50d2325ea80457a45d83c

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: checkout upstream
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.UPSTREAM_REF }}
          path: src

      # 本仓库的两个行为补丁（上游不动，只在这里落）：
      #   0001 监听失败不再 log.Fatal —— 端口被占时退避重试，进程常驻。
      #        iOS 上 App 内嵌服务与 daemon 抢 7863，旧行为是两边互相 os.Exit。
      #   0002 根路径 302 到 /panel/ —— 面板 HTML 用同目录相对路径，
      #        直接挂在 "/" 会让 theme.js/app.js 解析成 /theme.js 而 404。
      - name: apply patches
        run: |
          set -e
          for p in patches/*.patch; do
            echo "== apply $p"
            patch -p1 -d src --batch --forward < "$p"
          done

      - name: install local tests
        run: |
          set -e
          cp patches/tests/main_listen_retry_test.go src/cmd/server/
          cp patches/tests/handler_root_redirect_test.go src/internal/server/

      # 补丁打上 ≠ 真的接上了。0009 第一版就漏了 main.go 里那行调用：
      # 文件进了包、函数成了死代码，抬手 jetsam 等于没做。这里直接验接线。
      - name: verify patch wiring
        run: |
          set -e
          grep -q 'applyProcessLimits()' src/cmd/server/main.go
          grep -q 'go logBootMemory()' src/cmd/server/main.go
          grep -q 'rss=%dMB' src/cmd/server/main.go
          grep -q 'fp=%dMB' src/cmd/server/main.go
          test -f src/cmd/server/iosmem_darwin.go
          test -f src/cmd/server/iosmem_other.go
          echo "wiring ok"

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod

      # 跨 45 个上游提交换基线，先立回归网。/toolonly、sse_frame_split、reload、
      # upstreamhealth、channel 都是这一批新加的，任一条不绿就不该出包。
      - name: go test
        run: |
          set -e
          cd src
          go test ./...

      # 面板资源：默认跟随上游（2026-11-11 起）。上游面板已经带多文件导入预览、
      # 日志导出、账号目录热重载、更新通道、救援统计；再拿仓库里那三份 9 月快照
      # 覆盖回去，等于把新接口的入口全藏了。
      # legacy 只在回到 WKWebView 壳（wb.api.local）时才需要 —— 那个壳里原生
      # confirm() 会静默取消，assets/ 里的 gcConfirm 补丁就是为此打的。
      - name: select panel assets
        run: |
          set -e
          PANEL="${{ inputs.panel }}"
          if [[ "$PANEL" == "legacy" ]]; then
            cp assets/index.html assets/app.js assets/theme.js src/internal/panel/
            echo "panel: legacy（仓库内 WKWebView 补丁版）"
          else
            echo "panel: upstream（跟随 ${{ env.UPSTREAM_REF }}）"
          fi
          ls -l src/internal/panel/index.html src/internal/panel/app.js src/internal/panel/theme.js

      # 面板本身是桌面布局：卡片头的长提示被 overflow:hidden 裁掉、输入框 <16px 会让
      # iOS 聚焦时放整页、9 列的账号表在 390pt 上要横向拖 640px。
      #
      # 注入方式有个坑：面板 CSP 是 default-src 'none'; script-src 'self'，
      # **内联 <script> 会被拒**（style-src 里有 'unsafe-inline'，所以内联 CSS 可以）。
      # 因此 CSS 内联进 index.html，JS 追加到 app.js 末尾——app.js 本来就是 go:embed
      # 且在 /panel/app.js 白名单里，同源加载不受 CSP 影响。
      - name: inject ios mobile layout
        run: |
          set -e
          python3 - <<'PY'
          import pathlib

          # 1) CSS -> index.html 的 </head> 前
          p = pathlib.Path("src/internal/panel/index.html")
          html = p.read_text(encoding="utf-8")
          if "ios-mobile-css" in html:
              raise SystemExit("index.html 里已经有 ios-mobile-css，重复注入")
          if html.count("</head>") != 1:
              raise SystemExit("index.html 的 </head> 不是恰好一个，注入点不可靠")
          css = pathlib.Path("assets/ios-mobile.css").read_text(encoding="utf-8")
          block = '<style id="ios-mobile-css">\n' + css + '</style>\n'
          p.write_text(html.replace("</head>", block + "</head>", 1), encoding="utf-8")
          print("css:", len(block), "bytes ->", p.stat().st_size)

          # 2) JS -> app.js 末尾（同源脚本，CSP 放行）
          a = pathlib.Path("src/internal/panel/app.js")
          s = a.read_text(encoding="utf-8")
          if "ios-mobile-js" in s:
              raise SystemExit("app.js 里已经有 ios-mobile-js，重复注入")
          js = pathlib.Path("assets/ios-mobile.js").read_text(encoding="utf-8")
          a.write_text(s + "\n;/* ---- ios-mobile-js ---- */\n(function(){\n" + js + "\n})();\n", encoding="utf-8")
          print("js:", len(js), "bytes ->", a.stat().st_size)
          PY
          grep -q 'ios-mobile-css' src/internal/panel/index.html
          grep -q 'ios-mobile-js' src/internal/panel/app.js
          echo "mobile layout ok"

      - name: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(TZ=Asia/Shanghai date +%Y.%-m.%-d.%-H%M)" >> "$GITHUB_ENV"
          fi

      - name: build darwin/arm64
        run: |
          set -e
          cd src
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath -ldflags="-s -w -X main.appVersion=${VERSION}" -o ../wb2api ./cmd/server

      - name: patch platform (macos -> ios)
        run: python3 scripts/patch_platform.py wb2api

      - name: sign (ldid ad-hoc + entitlements)
        run: |
          set -e
          # ldid 已内置在 tools/ 里：GitHub Release CDN 对 runner 偶发 504，
          # 每次构建现下载会随机把流水线打挂。
          # -S<file> = 带 entitlements 签名。iOS 上 platform-application 决定
          # 该进程是「平台守护进程」还是「mobile 用户沙盒进程」，直接影响 jetsam band。
          chmod +x tools/ldid
          tools/ldid -Spackaging/wb2api.entitlements wb2api
          if ! grep -qa 'platform-application' wb2api; then
            echo "签名里没有 platform-application —— entitlements 没进包" >&2
            exit 1
          fi
          if ! grep -qa 'com.apple.private.memorystatus' wb2api; then
            echo "签名里没有 memorystatus —— 抬 jetsam 上限会 EPERM" >&2
            exit 1
          fi

      # 平台对 != 能加载。这一关检查 iOS 真实路径白名单 + 签名页哈希：
      # v2026.11.9-daemon 就是「平台改对了、路径还是 macOS」死在真机 dyld 上。
      - name: verify macho (iOS-loadable + 签名有效)
        run: |
          set -e
          python3 scripts/verify_macho.py wb2api
          dash -n packaging/postinst
          dash -n packaging/wb2api-doctor

      # 这一版真机死因是内核 per-process-limit（18MB）。少了这两个键就是复发。
      - name: verify plist (jetsam 限额)
        run: |
          set -e
          python3 - <<'PY'
          import plistlib
          d = plistlib.load(open('packaging/com.gan.wb2api.plist', 'rb'))
          j = d.get('JetsamProperties') or {}
          assert j.get('JetsamMemoryLimit', 0) >= 128, j
          assert j.get('JetsamPriority', 0) <= -10, j
          assert d.get('EnablePressuredExit') is False, 'EnablePressuredExit 必须是 false'
          assert d.get('KeepAlive') is True, d.get('KeepAlive')
          assert '@BIN@' in d['ProgramArguments'][0] or d['ProgramArguments'][0].startswith('/')
          print('plist ok:', j)
          PY

      - name: package deb
        run: |
          set -e
          ROOT=out
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/var/jb/usr/local/bin" "$ROOT/var/jb/Library/LaunchDaemons"
          cp wb2api "$ROOT/var/jb/usr/local/bin/wb2api"
          cp packaging/wb2api-doctor "$ROOT/var/jb/usr/local/bin/wb2api-doctor"
          cp packaging/com.gan.wb2api.plist "$ROOT/var/jb/Library/LaunchDaemons/"
          cp packaging/postinst "$ROOT/DEBIAN/postinst"
          sed "s/@VERSION@/${VERSION}/" packaging/control > "$ROOT/DEBIAN/control"
          chmod 755 "$ROOT/DEBIAN/postinst" "$ROOT/var/jb/usr/local/bin/wb2api" \
                    "$ROOT/var/jb/usr/local/bin/wb2api-doctor"
          chmod 644 "$ROOT/DEBIAN/control" "$ROOT/var/jb/Library/LaunchDaemons/com.gan.wb2api.plist"
          DEB="com.gan.wb2api_${VERSION}_iphoneos-arm64e.deb"
          # -Zgzip：越狱设备上的 dpkg 版本参差，zstd 不一定认，gzip 最稳
          dpkg-deb -Zgzip --build --root-owner-group "$ROOT" "$DEB"
          sha256sum "$DEB" | tee "$DEB.sha256"
          echo "DEB=$DEB" >> "$GITHUB_ENV"
          ls -l "$DEB"

      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-deb
          path: |
            ${{ env.DEB }}
            ${{ env.DEB }}.sha256

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DEB }}
            ${{ env.DEB }}.sha256
          generate_release_notes: true
